<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="icon" th:href="@{/images/iconweb.png}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400...lay=swap"
        rel="stylesheet">
</head>
<body>
    <header>
        <img th:src="@{/images/logologin.png}">
    </header>
    <div class="container" id="container">
        <div class="form-container login-container">
            <form th:action="@{/perform_login}" method="post">
                <h1>Login</h1>
                <input type="username" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <div class="content">
                    <div class="checkbox">
                        <input type="checkbox" name="remember" id="checkbox">
                        <label for="checkbox">Remember me</label>
                    </div>
                    <div class="pass-link">
                        <a th:href="@{/forgot-password}">Forgot password ?</a>
                    </div>
                </div>
                <button type="submit">Login</button>
                <button class="btn google-btn" >
                    <i class="fab fa-google"></i>
                    Login with Google
                </button> 
            
                <div th:if="${error}" class="error-message" th:text="${error}"></div>
            </form>
        </div>

        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-right" id="overlay-right">
                    <h1 class="title">Start your <br>journey now</h1>
                    <p>if you don't have an account yet, <br> let's create your account.</p>
                    <a th:href="@{/register}"><button class="ghost" id="register"  >Register<i class="fa-solid fa-arrow-right register"></i></button></a>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/js/login.js}"></script>
</body>
</html>
